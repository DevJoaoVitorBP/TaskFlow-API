version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow123}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - taskflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskflow_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: taskflow_api
    restart: unless-stopped
    ports:
      - '${PORT:-3333}:3333'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3333}
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow123}@postgres:5432/${POSTGRES_DB:-taskflow_db}?schema=public
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taskflow_network
    volumes:
      - ./prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  # Development variant (optional)
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: taskflow_api_dev
    restart: unless-stopped
    ports:
      - '3334:3333'
    environment:
      NODE_ENV: development
      PORT: 3333
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow123}@postgres:5432/${POSTGRES_DB:-taskflow_db}?schema=public
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taskflow_network
    volumes:
      - .:/app
      - /app/node_modules
      - ./prisma:/app/prisma
    command: npm run dev
    profiles:
      - dev

volumes:
  taskflow_postgres_data:
    driver: local

networks:
  taskflow_network:
    driver: bridge
