name: Coverage Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  coverage:
    name: Validate Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check coverage thresholds
        run: |
          echo "Checking coverage thresholds..."
          
          # Parse v8 coverage JSON and verify thresholds
          # v8/istanbul format uses 's' (statements), 'f' (functions), 'b' (branches)
          python3 << 'EOF'
          import json
          import sys
          
          with open('./coverage/coverage-final.json', 'r') as f:
              coverage = json.load(f)
          
          total_statements = 0
          covered_statements = 0
          total_functions = 0
          covered_functions = 0
          total_branches = 0
          covered_branches = 0
          total_lines = 0
          covered_lines = 0
          
          for file_data in coverage.values():
              # 's' is {stmt_id: hit_count}
              if 's' in file_data:
                  for hit_count in file_data['s'].values():
                      total_statements += 1
                      if hit_count > 0:
                          covered_statements += 1
              
              # 'f' is {fn_id: hit_count}
              if 'f' in file_data:
                  for hit_count in file_data['f'].values():
                      total_functions += 1
                      if hit_count > 0:
                          covered_functions += 1
              
              # 'b' is {branch_id: [hit_count_per_location, ...]}
              if 'b' in file_data:
                  for branch_counts in file_data['b'].values():
                      for hit_count in branch_counts:
                          total_branches += 1
                          if hit_count > 0:
                              covered_branches += 1
              
              # Derive lines from statementMap + s
              if 'statementMap' in file_data and 's' in file_data:
                  line_hits = {}
                  for stmt_id, stmt_loc in file_data['statementMap'].items():
                      line = stmt_loc['start']['line']
                      hit = file_data['s'].get(stmt_id, 0)
                      line_hits[line] = max(line_hits.get(line, 0), hit)
                  for hits in line_hits.values():
                      total_lines += 1
                      if hits > 0:
                          covered_lines += 1
          
          statements_pct = (covered_statements / total_statements * 100) if total_statements > 0 else 0
          functions_pct = (covered_functions / total_functions * 100) if total_functions > 0 else 0
          branches_pct = (covered_branches / total_branches * 100) if total_branches > 0 else 100.0
          lines_pct = (covered_lines / total_lines * 100) if total_lines > 0 else 0
          
          print(f"\n📊 Coverage Report")
          print(f"==================")
          print(f"Statements:  {statements_pct:.2f}% ({covered_statements}/{total_statements})")
          print(f"Functions:   {functions_pct:.2f}% ({covered_functions}/{total_functions})")
          print(f"Branches:    {branches_pct:.2f}% ({covered_branches}/{total_branches})")
          print(f"Lines:       {lines_pct:.2f}% ({covered_lines}/{total_lines})")
          print(f"==================")
          
          threshold = 80.0
          all_passed = True
          
          for label, pct, covered, total in [
              ('Statements', statements_pct, covered_statements, total_statements),
              ('Functions',  functions_pct,  covered_functions,  total_functions),
              ('Branches',   branches_pct,   covered_branches,   total_branches),
              ('Lines',      lines_pct,      covered_lines,      total_lines),
          ]:
              if pct < threshold:
                  print(f"❌ {label} coverage {pct:.2f}% below threshold {threshold}%")
                  all_passed = False
              else:
                  print(f"✓ {label} coverage {pct:.2f}% meets threshold {threshold}%")
          
          sys.exit(0 if all_passed else 1)
          EOF

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-final.json', 'utf8'));
            
            let comment = '## 📊 Test Coverage Report\n\n';
            comment += '| Metric | Status |\n';
            comment += '|--------|--------|\n';
            comment += '| Lines | ✓ Checked |\n';
            comment += '| Functions | ✓ Checked |\n';
            comment += '| Branches | ✓ Checked |\n';
            comment += '| Statements | ✓ Checked |\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
